; Default settings of this Slicer fork ("Slicer Studio").
;
; At startup, each key below that is missing from the user settings is copied into them, even
; under --testing (see "Load default settings if any" in qSlicerCoreApplication.cxx). The merge
; must follow command-line parsing, so that --testing and --disable-settings copy the keys into
; the temporary Slicer-tmp settings; until it does, Applications/SlicerApp/CMakeLists.txt does
; not install this file (each consumer falls back to the same value). The user settings file
; is shared with official Slicer installations, therefore this file follows two rules:
; - Only keys whose consumer ignores them under --testing.
; - Only fork-specific keys (Studio/*, Appearance/*) that official Slicer does not read. Never
;   Styles/Style, font, Modules/*, MainWindow/*, Views/*, Python/* or Developer/* keys.

[Studio]
Enabled=true
StartWorkspace=Library
PanelWidth=340

[Appearance]
ForkDefaultTheme=Dark
ForkDefaultFontFamily=Inter
ForkDefaultFontPointSize=9.75
