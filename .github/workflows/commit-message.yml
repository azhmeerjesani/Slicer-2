name: "Commit Message Check"
# Slicer Studio: manual runs only. GitHub is used only as the git remote (see CLAUDE.md), so no workflow
# runs on pushes, pull requests, tags or a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: Slicer/slicer-check-commit-message-action@26db1d4a0580194025a00bff6f5c24a88c0efb9f # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
