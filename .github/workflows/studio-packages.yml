name: Slicer Studio packages

# DISABLED: this workflow is disabled on the repository and must not be run or
# re-enabled. GitHub is used only as the git remote of this fork (see
# CLAUDE.md); packages are built locally (Docs/user_guide/install_studio.md).
# The file is kept as a reference for the build steps.
#
# Builds installable Slicer Studio packages on demand (Actions tab > "Slicer
# Studio packages" > "Run workflow"): a macOS disk image (.dmg), a Linux
# tarball and, optionally, the web (browser) Docker image. The packages are
# attached to the workflow run as artifacts. See
# Docs/user_guide/install_studio.md.
#
# Pushing a tag named "studio-build-*", or pushing a change to
# .github/studio-packages-request.txt on any branch, also runs the workflow, with
# the default choices (Apple Silicon disk image with the official Qt, and Linux
# tarball). This allows building packages from any branch, as "Run workflow" is
# only available for workflows that are on the default branch.
#
# A first build takes several hours. When a build step reaches its time limit,
# the compiler cache is still saved, so running the workflow again continues
# from where it stopped.

on:
  push:
    # Branch pushes run the workflow only when they change the request file (paths
    # filters are not evaluated for tag pushes).
    branches:
      - "**"
    tags:
      - "studio-build-*"
    paths:
      - ".github/studio-packages-request.txt"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (empty: the selected branch)"
        type: string
        required: false
        default: ""
      macos:
        description: "macOS disk image for Apple Silicon (arm64)"
        type: boolean
        default: true
      macos_intel:
        description: "macOS disk image for Intel Macs (x86_64)"
        type: boolean
        default: false
      qt:
        description: "Qt for the Apple Silicon build: official (runs on macOS 14 and newer) or homebrew (runs on macOS 15 and newer)"
        type: choice
        options:
          - official
          - homebrew
        default: official
      linux:
        description: "Linux tarball (Ubuntu 24.04, system Qt 5.15)"
        type: boolean
        default: true
      docker:
        description: "Web (browser) Docker image pushed to ghcr.io (needs the Linux tarball)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-packages-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux tarball
    if: ${{ github.event_name == 'push' || inputs.linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      package: ${{ steps.package.outputs.package }}
    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up paths
        run: |
          {
            echo "BUILD_DIR=$HOME/S"
            echo "LOG_DIR=$RUNNER_TEMP/logs"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_BASEDIR=$HOME"
          } >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/ccache"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      # The same packages as the Ubuntu 24.04 (Qt 5) build instructions in
      # Docs/developer_guide/build_instructions/linux.md, plus OpenGL, OpenSSL
      # and the tools used below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git git-lfs cmake ccache patch \
            libqt5x11extras5-dev qtmultimedia5-dev libqt5svg5-dev qtwebengine5-dev \
            libqt5xmlpatterns5-dev qttools5-dev qtbase5-private-dev \
            libxt-dev libgl-dev libglu1-mesa-dev libssl-dev \
            xvfb xauth
          /usr/bin/cmake --version
          ccache --version | head -n 1

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-x86_64-

      # System OpenSSL: Ubuntu's Qt 5 is built against OpenSSL 3, so the
      # application must not bundle another OpenSSL.
      - name: Configure
        run: |
          /usr/bin/cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DBUILD_TESTING:BOOL=OFF \
            -DSlicer_BUILD_DOCUMENTATION:BOOL=OFF \
            -DSlicer_USE_VTK_DEBUG_LEAKS:BOOL=OFF \
            -DSlicer_BUILD_QT_DESIGNER_PLUGINS:BOOL=OFF \
            -DQt5_DIR:PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt5 \
            -DSlicer_REQUIRED_QT_VERSION:STRING=5.15 \
            -DSlicer_USE_SYSTEM_OpenSSL:BOOL=ON \
            -DCMAKE_C_COMPILER:FILEPATH=/usr/lib/ccache/gcc \
            -DCMAKE_CXX_COMPILER:FILEPATH=/usr/lib/ccache/g++ \
            2>&1 | tee "$LOG_DIR/configure.log"
          ccache --zero-stats

      - name: Build
        timeout-minutes: 300
        run: |
          /usr/bin/cmake --build "$BUILD_DIR" --parallel "$(nproc)" 2>&1 | tee "$LOG_DIR/build.log"

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package
        id: package
        timeout-minutes: 60
        run: |
          /usr/bin/cmake --build "$BUILD_DIR/Slicer-build" --target package 2>&1 | tee "$LOG_DIR/package.log" | tail -n 30
          package=$(find "$BUILD_DIR/Slicer-build" -maxdepth 1 -name 'Slicer-*-linux-amd64.tar.gz' -printf '%T@ %p\n' |
            sort -n | tail -n 1 | cut -d' ' -f2-)
          if [ -z "$package" ]; then
            echo "::error::make package did not produce a tarball"
            exit 1
          fi
          echo "package=$(basename "$package")" >>"$GITHUB_OUTPUT"
          echo "path=$package" >>"$GITHUB_OUTPUT"
          {
            echo "### Linux tarball"
            echo ""
            echo "\`$(basename "$package")\` ($(du -h "$package" | cut -f1)), SHA-256 \`$(sha256sum "$package" | cut -d' ' -f1)\`"
            echo ""
            echo "Built on Ubuntu 24.04 against the system Qt 5.15: see Docs/user_guide/install_studio.md for the runtime packages."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Start-up test
        continue-on-error: true
        timeout-minutes: 20
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$PACKAGE" -C "$RUNNER_TEMP/smoke"
          launcher=$(find "$RUNNER_TEMP/smoke" -mindepth 2 -maxdepth 2 -name Slicer -type f | head -n 1)
          # Shared with the macOS disk image build: start-up, Studio shell, scene and NIfTI round trip.
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 600 "$launcher" --no-splash --disable-settings \
            --ignore-slicerrc --exit-after-startup --python-script Utilities/Scripts/SlicerStudioSmokeCheck.py 2>&1 \
            | tee "$LOG_DIR/smoke.log"
          grep -q SLICER_STUDIO_SMOKE_OK "$LOG_DIR/smoke.log"
          # Errors in start-up callbacks are printed but do not stop the application.
          if grep -q "^Traceback (most recent call last)" "$LOG_DIR/smoke.log"; then
            echo "::error::a Python error was reported during start-up (see smoke.log)"
            exit 1
          fi

      - name: Upload logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-linux
          path: ${{ runner.temp }}/logs
          retention-days: 7
          if-no-files-found: ignore

  macos:
    name: macOS disk image (${{ matrix.arch }})
    if: ${{ github.event_name == 'push' || inputs.macos || inputs.macos_intel }}
    # macos-15 is the free Apple Silicon runner; macos-15-intel the Intel one.
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        exclude:
          - arch: ${{ github.event_name != 'push' && !inputs.macos && 'arm64' || 'none' }}
          - arch: ${{ (github.event_name == 'push' || !inputs.macos_intel) && 'x86_64' || 'none' }}
    env:
      ARCH: ${{ matrix.arch }}
      # Homebrew has no Qt bottles for Intel Macs: always use the official Qt there.
      QT_MODE: ${{ matrix.arch == 'x86_64' && 'official' || inputs.qt || 'official' }}
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up paths
        run: |
          {
            echo "STUDIO_WORK_DIR=$HOME/SlicerStudio"
            echo "STUDIO_BUILD_DIR=$HOME/S"
            echo "STUDIO_OUT_DIR=$HOME/SlicerStudio/dist"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_BASEDIR=$HOME"
          } >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ccache"
          sw_vers
          echo "architecture: $(uname -m), CPUs: $(sysctl -n hw.ncpu), memory: $(($(sysctl -n hw.memsize) / 1073741824)) GB"
          echo "Xcode: $(xcode-select -p)"
          df -h /

      - name: Free disk space
        run: |
          free_gb=$(df -g / | awk 'NR == 2 { print $4 }')
          echo "free disk: ${free_gb} GB"
          if [ "$free_gb" -lt 60 ]; then
            sudo rm -rf "$HOME/Library/Android" "$HOME/.dotnet" /usr/local/share/dotnet || true
            # Remove the Xcode versions that are not selected.
            selected=$(cd "$(xcode-select -p)/../.." && pwd -P)
            for xcode in /Applications/Xcode_*.app; do
              if [ -d "$xcode" ] && [ "$(cd "$xcode" && pwd -P)" != "$selected" ]; then
                sudo rm -rf "$xcode"
              fi
            done
            df -h /
          fi

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ env.QT_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-macos-${{ matrix.arch }}-${{ env.QT_MODE }}-

      # The time limits of this job's steps add up to less than the job limit,
      # so the compiler cache is saved even when the build is stopped.
      - name: Build (tools, Qt, superbuild)
        timeout-minutes: 270
        run: |
          bash Utilities/Scripts/SlicerStudioMacOS/build_dmg.sh --ci --qt="$QT_MODE" \
            --work-dir "$STUDIO_WORK_DIR" --build-dir "$STUDIO_BUILD_DIR" --out-dir "$STUDIO_OUT_DIR" \
            --no-package

      - name: Compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ env.QT_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package (disk image)
        id: package
        timeout-minutes: 60
        run: |
          bash Utilities/Scripts/SlicerStudioMacOS/build_dmg.sh --ci --qt="$QT_MODE" \
            --work-dir "$STUDIO_WORK_DIR" --build-dir "$STUDIO_BUILD_DIR" --out-dir "$STUDIO_OUT_DIR" \
            --skip-deps --skip-build --no-smoke
          dmg=$(find "$STUDIO_OUT_DIR" -maxdepth 1 -name "SlicerStudio-*-macos-${ARCH}.dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "::error::no disk image in $STUDIO_OUT_DIR"
            exit 1
          fi
          echo "dmg=$dmg" >>"$GITHUB_OUTPUT"
          {
            echo "### macOS disk image ($ARCH, Qt: $QT_MODE)"
            echo ""
            echo "\`$(basename "$dmg")\` ($(du -h "$dmg" | cut -f1)), SHA-256 \`$(cut -d' ' -f1 "$dmg.sha256")\`"
            echo ""
            echo "Open it and drag **Slicer Studio** to Applications. It is ad-hoc signed (not notarized): see Docs/user_guide/install_studio.md."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.dmg }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      # Starts the packaged application from the disk image. Informational:
      # hosted runners have no GPU, so a failure here does not fail the run.
      - name: Start-up test
        continue-on-error: true
        timeout-minutes: 15
        run: |
          bash Utilities/Scripts/SlicerStudioMacOS/build_dmg.sh --ci --smoke-only \
            --work-dir "$STUDIO_WORK_DIR" --out-dir "$STUDIO_OUT_DIR"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-macos-${{ matrix.arch }}
          path: ${{ env.STUDIO_WORK_DIR }}/logs
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Web image
    needs: linux
    if: ${{ inputs.docker && inputs.linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download the Linux tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux.outputs.package }}
          path: ${{ runner.temp }}/package

      - name: Build the image
        id: image
        env:
          PACKAGE_NAME: ${{ needs.linux.outputs.package }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/slicer-studio-web"
          revision=$(git rev-parse HEAD)
          python3 Utilities/SlicerStudioWeb/slicer_studio_web.py build \
            --package "$RUNNER_TEMP/package/$PACKAGE_NAME" --tag "$image:$revision"
          docker tag "$image:$revision" "$image:latest"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Push to the GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$REVISION"
          docker push "$IMAGE:latest"
          docker logout ghcr.io
          {
            echo "### Web image"
            echo ""
            echo "\`$IMAGE:$REVISION\` (also tagged \`latest\`)."
            echo ""
            echo "Run it: \`docker pull $IMAGE:latest\`, then \`python3 Utilities/SlicerStudioWeb/slicer_studio_web.py run --image $IMAGE:latest\` (see Utilities/SlicerStudioWeb/README.md)."
          } >>"$GITHUB_STEP_SUMMARY"
